name: Publish n8n node to npm

permissions:
  contents: write   # required for pushing git tags

on:
  push:
    branches:
      - release

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # 🔹 Read name & version from package.json
      - name: Read package details
        id: pkg
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Package: $NAME"
          echo "🔢 Version: $VERSION"

      # 🔹 Check npm registry for existing version
      - name: Check if version already published
        id: check
        run: |
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # ❌ Stop with clear UI error
      - name: Stop publish if version already exists
        if: steps.check.outputs.exists == 'true'
        run: |
          echo "::error::❌ Publish blocked!"
          echo "::error::📦 Package '${{ steps.pkg.outputs.name }}'"
          echo "::error::🔢 Version '${{ steps.pkg.outputs.version }}' is already published on npm."
          echo "::error::👉 Please bump the version in package.json (patch/minor/major) and retry."
          exit 1

      # 🚀 Publish to npm
      - name: Publish to npm
        run: |
          echo "🚀 Publishing to npm..."
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.N8N_NAMECONCAT_02 }}

      # 🏷️ Create & push git tag
      - name: Create and push git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          TAG="v${{ steps.pkg.outputs.version }}"
          git tag $TAG
          git push origin $TAG
